name: Railway tracker validation

on:
  push:
    branches:
      - feature/railway-live-statistics
    paths:
      - 'railway_tracker/**'
      - 'requirements-railway.txt'
      - '.github/workflows/railway-tracker-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-railway.txt
      - name: Compile Python modules
        run: python -m compileall -q railway_tracker
      - name: Verify TikTokLive event imports
        run: |
          python - <<'PY'
          from TikTokLive import TikTokLiveClient
          from TikTokLive.events import CommentEvent, GiftEvent, LikeEvent, RoomUserSeqEvent, ShareEvent, FollowEvent
          print("TikTokLive client and all required event classes imported successfully")
          PY
