name: TikTok LIVE Tracker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: tiktok-live-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tracker
        run: |
          python -m pip install --upgrade pip
          pip install "TikTokLive>=6.0.0,<7" requests
      - name: Check TikTok LIVE status and save sessions
        env:
          SUPABASE_URL: https://hfmosadynxpwkscvpard.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/tiktok_live_tracker.py
