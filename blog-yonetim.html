<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>Blog Yönetimi | Nowa Online World</title><link rel="icon" href="/img/favicon.png"><style>
:root{--bg:#090b10;--panel:#121720;--line:#2b3544;--gold:#e8b95c;--muted:#9aa5b4;--text:#f4f5f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -15%,#49351c 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{width:min(1180px,calc(100% - 32px));margin:28px auto}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 20px;background:#111720;border:1px solid var(--line);border-radius:14px;margin-bottom:16px}.head h1{font-size:17px;margin:0}.head p{font-size:11px;color:var(--muted);margin:4px 0 0}.btn{border:1px solid var(--line);background:#19212c;color:var(--text);padding:9px 13px;border-radius:8px;font-weight:750;font-size:12px}.gold{background:linear-gradient(135deg,#f0c66f,#b17a2e);color:#17120a;border:0}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px}.side,.main{border:1px solid var(--line);background:#111720;border-radius:13px;padding:16px}.side a{display:block;color:#cbd1da;text-decoration:none;padding:10px;border-radius:7px;font-size:12px}.side a.active,.side a:hover{background:#302719;color:#f1cf83}.side h3{font-size:10px;color:#7f8998;letter-spacing:.12em;margin:4px 10px 9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}.stat{padding:12px;border:1px solid var(--line);border-radius:9px;background:#151d28}.stat small{color:var(--muted);display:block;font-size:10px}.stat b{font-size:22px;color:var(--gold)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.post{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0;background:#151d28}.post strong{display:block;font-size:12px}.post small{color:var(--muted);font-size:10px}.actions{display:flex;gap:6px;flex-wrap:wrap}.form{display:none;margin-top:14px;padding:16px;border:1px solid #72552d;border-radius:11px;background:#151a22}.form.open{display:block}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field label{display:block;color:#c3cad4;font-size:11px;font-weight:750;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#0c1118;border:1px solid #354253;color:#f4f5f7;border-radius:7px;padding:10px;font-size:12px;outline:none}.field textarea{resize:vertical}.wide{grid-column:1/-1}.status{padding:10px;border-radius:8px;background:#1b2733;color:#aeb9c7;font-size:11px;margin-bottom:12px}.login{max-width:420px;margin:10vh auto;padding:24px;background:#111720;border:1px solid var(--line);border-radius:14px}.login h1{font-size:19px}.login .field{margin:12px 0}.login input{width:100%;background:#0c1118;border:1px solid #354253;color:white;padding:11px;border-radius:8px}.hidden{display:none!important}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#202b38;border:1px solid #526173;color:white;border-radius:9px;padding:10px 14px;font-size:12px;display:none;z-index:9}.back{color:#e8b95c;text-decoration:none;font-size:11px}@media(max-width:760px){.shell{width:calc(100% - 20px);margin:10px auto}.head{padding:13px;align-items:flex-start}.layout{grid-template-columns:1fr}.side{display:flex;gap:4px;overflow:auto;padding:7px}.side h3{display:none}.side a{white-space:nowrap}.stats{grid-template-columns:repeat(3,1fr)}.main{padding:12px}.post{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.head h1{font-size:14px}}
</style></head><body>
<section id="loginView" class="login"><h1>Blog Yönetimi</h1><p style="color:var(--muted);font-size:12px">Yönetici hesabınla giriş yap.</p><form id="loginForm"><div class="field"><label>E-posta</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Şifre</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn gold" style="width:100%" type="submit">Giriş yap</button></form><p id="loginError" class="status hidden"></p><p><a class="back" href="/blog">← Blog sayfasına dön</a></p></section>
<div id="app" class="shell hidden"><header class="head"><div><h1>NOWA ONLINE WORLD · BLOG YÖNETİMİ</h1><p>Yazılarını oluştur, düzenle, taslak kaydet ve yayınla.</p></div><div class="actions"><a class="btn" href="/blog">Blogu görüntüle</a><button class="btn" id="logout">Çıkış</button></div></header><div class="layout"><aside class="side"><h3>İÇERİK</h3><a class="active" href="#posts">Blog Yazıları</a><a href="/yonetim">Ana Yönetim Paneli</a><a href="/">Ana Sayfa</a></aside><main class="main"><div class="stats"><div class="stat"><small>Toplam yazı</small><b id="totalCount">0</b></div><div class="stat"><small>Yayında</small><b id="publishedCount">0</b></div><div class="stat"><small>Taslak</small><b id="draftCount">0</b></div></div><div class="toolbar"><button class="btn gold" id="newPost">+ Yeni yazı oluştur</button><button class="btn" id="refresh">↻ Yenile</button></div><div id="status" class="status">Yazılar yükleniyor...</div><div id="posts"></div>
<section id="editor" class="form"><h2 id="editorTitle" style="font-size:15px;margin:0 0 14px">Yeni blog yazısı</h2><form id="postForm"><input type="hidden" name="id"><div class="formgrid">
<div class="field"><label>Yazı başlığı</label><input name="title" required maxlength="180"></div><div class="field"><label>URL kısa adı</label><input name="slug" required maxlength="180"></div>
<div class="field"><label>Kategori</label><select name="category"><option>Duyurular</option><option>Güncelleme Notları</option><option>Etkinlikler</option><option>Rehberler</option></select></div><div class="field"><label>Yazar</label><input name="author" value="QuetraOnline"></div>
<div class="field wide"><label>Kısa açıklama</label><textarea name="excerpt" rows="3" maxlength="400"></textarea></div><div class="field wide"><label>Kapak görseli URL</label><input name="cover_image" type="url" placeholder="https://..."></div>
<div class="field wide"><label>İçerik</label><textarea name="content" rows="14" placeholder="Yazının içeriğini buraya gir. Paragraflar için satır boşluğu kullanabilirsin."></textarea></div>
<div class="field"><label>Yayın durumu</label><select name="status"><option value="draft">Taslak</option><option value="published">Yayınla</option><option value="archived">Arşivle</option></select></div>
<div class="field"><label>SEO başlığı</label><input name="seo_title" maxlength="180"></div><div class="field"><label>SEO açıklaması</label><input name="seo_description" maxlength="300"></div>
<div class="field"><label style="display:flex;gap:8px;align-items:center"><input name="is_featured" type="checkbox" style="width:auto"> Öne çıkan yazı</label></div></div><div class="toolbar" style="margin-top:14px"><button class="btn gold" id="save" type="submit">Kaydet</button><button class="btn" id="cancel" type="button">Vazgeç</button></div></form></section></main></div></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script>
const db=window.supabase.createClient("https://hfmosadynxpwkscvpard.supabase.co","sb_publishable_1UDqJWj6DAKrx7tfWMs2lA_nW-Ee29S");
const $=id=>document.getElementById(id);let posts=[];
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2600)}
function slugify(v){return String(v||"").toLocaleLowerCase("tr").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ı/g,"i").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function adminCheck(user){if(!user)return false;const {data,error}=await db.from("nowa_admins").select("user_id").eq("user_id",user.id).maybeSingle();return !!data&&!error}
async function loadPosts(){ $("status").textContent="Veritabanından yazılar alınıyor...";const {data,error}=await db.from("nowa_blog_posts").select("*").order("created_at",{ascending:false});if(error){$("status").textContent="Veritabanı hatası: "+error.message;return}posts=data||[];$("totalCount").textContent=posts.length;$("publishedCount").textContent=posts.filter(p=>p.status==="published").length;$("draftCount").textContent=posts.filter(p=>p.status==="draft").length;$("status").textContent=posts.length?posts.length+" yazı bulundu.":"Henüz blog yazısı oluşturulmamış."; $("posts").innerHTML=posts.map(p=>'<article class="post"><div><strong>'+esc(p.title)+'</strong><small>'+esc(p.category)+' · '+(p.status==="published"?"Yayında":p.status==="archived"?"Arşiv":"Taslak")+' · /blog/'+esc(p.slug)+'</small></div><div class="actions"><button class="btn" data-edit="'+p.id+'">Düzenle</button><a class="btn" href="/blog/'+encodeURIComponent(p.slug)+'" target="_blank" rel="noopener">Görüntüle</a><button class="btn" data-delete="'+p.id+'">Sil</button></div></article>').join("");$("posts").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(posts.find(p=>p.id===b.dataset.edit)));$("posts").querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>removePost(b.dataset.delete))}
function edit(p){const f=$("postForm");f.reset();f.elements.id.value=p?.id||"";for(const k of ["title","slug","category","author","excerpt","cover_image","content","status","seo_title","seo_description"])f.elements[k].value=p?.[k]??(k==="author"?"QuetraOnline":k==="category"?"Duyurular":k==="status"?"draft":"");f.elements.is_featured.checked=!!p?.is_featured;$("editorTitle").textContent=p?"Yazıyı düzenle":"Yeni blog yazısı";$("editor").classList.add("open");$("editor").scrollIntoView({behavior:"smooth",block:"start"})}
async function removePost(id){const p=posts.find(x=>x.id===id);if(!p||!confirm('"'+p.title+'" yazısı silinsin mi?'))return;const {error}=await db.from("nowa_blog_posts").delete().eq("id",id);if(error){toast("Silinemedi: "+error.message);return}toast("Yazı silindi.");loadPosts()}
$("postForm").elements.title.addEventListener("input",()=>{if(!$("postForm").elements.id.value)$("postForm").elements.slug.value=slugify($("postForm").elements.title.value)});
$("newPost").onclick=()=>edit(null);$("refresh").onclick=loadPosts;$("cancel").onclick=()=>$("editor").classList.remove("open");
$("postForm").onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),id=String(fd.get("id")||""),status=String(fd.get("status"));const payload={title:String(fd.get("title")).trim(),slug:slugify(fd.get("slug")),category:String(fd.get("category")),author:String(fd.get("author")||"QuetraOnline"),excerpt:String(fd.get("excerpt")||""),cover_image:String(fd.get("cover_image")||"").trim()||null,content:String(fd.get("content")||""),status,is_featured:f.elements.is_featured.checked,seo_title:String(fd.get("seo_title")||"").trim()||null,seo_description:String(fd.get("seo_description")||"").trim()||null,updated_at:new Date().toISOString()};if(status==="published")payload.published_at=new Date().toISOString();if(!payload.title||!payload.slug){toast("Başlık ve URL gerekli.");return}$("save").disabled=true;try{const result=id?await db.from("nowa_blog_posts").update(payload).eq("id",id):await db.from("nowa_blog_posts").insert(payload);if(result.error)throw result.error;toast(status==="published"?"Yazı yayınlandı.":"Yazı kaydedildi.");$("editor").classList.remove("open");await loadPosts()}catch(err){toast("Kaydetme hatası: "+err.message)}finally{$("save").disabled=false}};
$("loginForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);$("loginError").classList.add("hidden");const {data,error}=await db.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(error){$("loginError").textContent="Giriş başarısız: "+error.message;$("loginError").classList.remove("hidden");return}if(!await adminCheck(data.user)){await db.auth.signOut();$("loginError").textContent="Bu hesap blog yönetimi yetkisine sahip değil.";$("loginError").classList.remove("hidden");return}showApp()};
async function showApp(){const {data}=await db.auth.getUser();if(!await adminCheck(data.user)){await db.auth.signOut();return}$("loginView").classList.add("hidden");$("app").classList.remove("hidden");loadPosts()}
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
db.auth.getSession().then(async({data})=>{if(data.session&&await adminCheck(data.session.user))showApp()});
</script></body></html>
